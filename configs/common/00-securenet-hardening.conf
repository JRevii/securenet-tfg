# /etc/ssh/sshd_config.d/00-securenet-hardening.conf  (PC1 and PC2)
# SecureNet v1.1 (S6). Loaded before 50-cloud-init.conf, and the first value wins.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitRootLogin no
MaxAuthTries 3
X11Forwarding no
