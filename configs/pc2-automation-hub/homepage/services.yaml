# SecureNet v1.1 - Homepage services (https://gethomepage.dev/configs/services)
# Widget secrets come from HOMEPAGE_VAR_* variables (/root/securenet/.env), never from this file.
# Container status dots and CPU/RAM/network stats come from "securenet-docker" (docker.yaml):
# a read-only socket proxy. PC1 services run on bare metal, so their dot is a ping to the
# gateway (host reachable), not a per-service check; Uptime Kuma monitors Pi-hole itself.

- Seguridad:
    - Pi-hole:
        icon: pi-hole.png
        href: http://192.168.2.10/admin/
        description: DNS con filtrado de anuncios y malware · PC1
        # ping instead of siteMonitor: Pi-hole's web server answers HEAD with a body
        # and Node's strict HTTP parser rejects it
        ping: 192.168.2.10
        widget:
          type: pihole
          url: http://192.168.2.10
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - WireGuard:
        icon: wireguard.png
        description: VPN del laboratorio · PC1
        ping: 192.168.2.10

    - Fail2Ban:
        icon: fail2ban.png
        description: Bloqueo de fuerza bruta SSH con alerta en Telegram · PC1
        ping: 192.168.2.10

    - Firewall (UFW):
        icon: mdi-wall-fire
        description: Política por defecto denegar en PC1 y PC2 · Docker filtrado en DOCKER-USER

- Monitorización:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://192.168.2.20:3001/status/securenet
        description: Comprobaciones cada 20 s y alertas directas a Telegram
        server: securenet-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: securenet
          # no "uptime": Kuma 1.x counts the time the VMs were powered off as downtime
          fields: ["up", "down"]

    - n8n:
        icon: n8n.png
        href: http://192.168.2.20:5678
        description: Autorrecuperación, alertas, escáner de red, backups e informe diario
        server: securenet-docker
        container: n8n

    # "Infraestructura" is nested under "Monitorización" (centre column): what runs behind
    # the services, showing least privilege at a glance
    - Infraestructura:
        - MariaDB:
            icon: mariadb.png
            description: Base de datos de Nextcloud · sin puertos publicados
            server: securenet-docker
            container: nextcloud-db
            showStats: true

        - Proxy Docker de n8n:
            icon: linuxserver-io.png
            description: Solo listar y reiniciar (POST=0) · crear → 403
            server: securenet-docker
            container: docker-socket-proxy

        - Proxy Docker de Homepage:
            icon: linuxserver-io.png
            description: Solo lectura, en una red interna aislada
            server: securenet-docker
            container: homepage-socket-proxy

        - Homepage:
            icon: homepage.png
            description: Este panel · sin acceso directo al socket de Docker
            server: securenet-docker
            container: homepage
            showStats: true

# "Gestión" is nested inside "Servicios" so both share the third column
- Servicios:
    - Nextcloud:
        icon: nextcloud.png
        href: http://192.168.2.20:8080
        description: Nube privada · servicio de prueba para las demos
        server: securenet-docker
        container: nextcloud
        widget:
          type: nextcloud
          url: http://192.168.2.20:8080
          key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
          fields: ["freespace", "numfiles"]

    - Gestión:
        - Portainer:
            icon: si-portainer-#13BEF9    # Simple Icons glyph: no white tile behind it
            href: https://192.168.2.20:9443
            description: Parado por defecto · se arranca solo para tareas de administración
            server: securenet-docker
            container: portainer          # stopped -> grey dot (custom.css)
