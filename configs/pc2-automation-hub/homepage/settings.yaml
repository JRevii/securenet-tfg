# SecureNet v1.1 - Homepage settings (https://gethomepage.dev/configs/settings)
title: SecureNet
description: Laboratorio de seguridad, monitorización y respuesta automática
favicon: /images/favicon.svg
language: es
theme: dark
color: slate

headerStyle: boxedWidgets
cardBlur: md
statusStyle: dot
hideVersion: true
useEqualHeights: true
target: _blank

background:
  image: /images/background.svg
  opacity: 100

# Groups are laid out as four columns; each one has its own icon
layout:
  Seguridad de red:
    icon: mdi-shield-lock-outline
  Monitorización y automatización:
    icon: mdi-chart-timeline-variant
  Servicios:
    icon: mdi-cloud-lock-outline
  Gestión:
    icon: mdi-tools
