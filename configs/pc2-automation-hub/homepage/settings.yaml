# SecureNet v1.1 - Homepage settings (https://gethomepage.dev/configs/settings)
title: SecureNet
description: Laboratorio de seguridad, monitorización y respuesta automática
favicon: /images/favicon.svg
language: es
theme: dark
color: slate

headerStyle: boxedWidgets
cardBlur: md
statusStyle: dot
hideVersion: true
useEqualHeights: true
disableCollapse: true    # no chevron next to the group titles
target: _blank

background:
  image: /images/background.svg
  opacity: 100

# Three columns (Gestión nested in Monitorización, Infraestructura in Servicios);
# short titles so none of them wraps at 1920x1080
layout:
  Seguridad:
    icon: mdi-shield-lock-outline
  Monitorización:
    icon: mdi-chart-timeline-variant
  Servicios:
    icon: mdi-cloud-lock-outline
  Gestión:
    icon: mdi-tools
  Infraestructura:
    icon: mdi-docker
  # bookmarks: a single row of four links, no group header
  Enlaces:
    style: row
    columns: 4
    header: false
