# Fail2Ban action: notify n8n (PC2) about every ban.
#
# v1.1 (S1): the n8n webhook requires a shared key in the X-SecureNet-Key header.
# The key lives only in /etc/fail2ban/n8n-webhook.key (root:root 600) and is
# piped to curl through stdin (-H @-), so it never appears in this file, in the
# process list or in the Fail2Ban log. %% is Fail2Ban's escape for a literal %.
# --fail makes curl exit non-zero on 403, so a rejected key shows up as an
# action error in /var/log/fail2ban.log (the ban itself is still applied by action_).

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = printf 'X-SecureNet-Key: %%s' "$(cat /etc/fail2ban/n8n-webhook.key)" | \
  curl -sS --fail -m 5 -o /dev/null -X POST "http://192.168.2.20:5678/webhook/fail2ban" \
  -H @- \
  -H "Content-Type: application/json" \
  -d "{\"event\":\"BAN\",\"jail\":\"<name>\",\"ip\":\"<ip>\",\"hostname\":\"$(hostname)\",\"ts\":\"$(date -Iseconds)\"}"
actionunban =
